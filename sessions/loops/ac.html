<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper {
            position: absolute;
            top: 30%;
            left: 30%;
            width: 500px;
            text-align: center;
        }

        .wrapper img {
            width: 95%;
        }

        .wrapper h1 {
            position: absolute;
            top: 20px;
            left: 43%;
        }
        .wrapper select {
            margin: 10px 0;
            padding: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    
    <div class="wrapper">
        <h1 id="degree">Off</h1>
        <img src="air-conditioner.png" alt="">

        <select name="" id="acdegree">
        </select>
    </div>

    <script>
        const acdegree = document.querySelector("#acdegree");
        const degree = document.querySelector('#degree')

        for(let i=0; i<=31; i++){
            if(i == 0){
                acdegree.innerHTML += `<option value="OFF">OFF</option>`;
            }
            else {
                acdegree.innerHTML += `<option value="${i}">${i}</option>`;
            }
            
        }

        acdegree.addEventListener('change', function(e){
degree.textContent = e.target.value;
        })
 
    </script>
</body>
</html>
